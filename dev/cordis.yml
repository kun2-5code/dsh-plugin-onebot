# 本地开发 overlay：在 deepseek-harness 源码根目录运行
#
#   pnpm dsh web --patch /absolute/path/to/dsh-plugin-onebot/dev/cordis.yml
#
# 插件路径必须为绝对路径（overlay 不改变 profile 的模块解析目录）。
- insert:
    - id: dsh-plugin-onebot
      name: '/Users/apple/Desktop/repo/deepseek-harness/dsh-plugin-onebot/src/index.ts'
      config:
        http:
          url: http://127.0.0.1:3000
          token: ''
          timeoutMs: 10000
        ws:
          mode: server
          host: 0.0.0.0
          port: 8080
          path: /ws
          token: ''
          reconnectInterval: 3000
        notify:
          notifyOn: idle
          onError: true
          includeSubagents: false
          targets:
            - type: private
              id: ''
            - type: group
              id: ''
          template: '【任务完成】\n会话: {sessionId}\n状态: {status}\n\n{summary}'
          maxLength: 2000
          retries: 3
          retryDelayMs: 1000
          verbose: true
