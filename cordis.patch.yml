# dsh-plugin-onebot 的 bundle 层：安装进 profile 后由 dsh 加载。
# 每个条目对应一个插件模块；后层按 id 覆盖前层，覆盖整行 config 而非深合并。
- insert:
    - id: dsh-plugin-onebot
      name: dsh-plugin-onebot
      config:
        http:
          # NapCat 默认 HTTP 端口是 3000；go-cqhttp 默认 5700。
          url: http://127.0.0.1:3000
          # 与 NapCat「网络配置」里设置的 token 保持一致；留空则不携带。
          token: ''
          timeoutMs: 10000
        ws:
          # server：插件作为 WS 服务端，NapCat 配「反向 WebSocket 客户端」连进来（推荐）
          # client：插件主动连 NapCat「正向 WebSocket 服务端」；off：关闭长连接
          mode: server
          host: 0.0.0.0
          port: 8080
          path: /ws
          # 与 NapCat 反向 WS 配置里的 token 保持一致；留空则不鉴权。
          token: ''
          reconnectInterval: 3000
        notify:
          # idle：整个任务完成通知一次；turn：每个回合结束都通知
          notifyOn: idle
          onError: true
          includeSubagents: false
          # 默认通知目标，按需增删；type 为 private（QQ 号）或 group（群号）
          targets:
            - type: private
              id: ''
            - type: group
              id: ''
          template: '【任务完成】\n会话: {sessionId}\n状态: {status}\n\n{summary}'
          maxLength: 2000
          retries: 3
          retryDelayMs: 1000
          verbose: false
